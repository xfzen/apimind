name: verify

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pinned workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Verify documentation and source boundaries
        run: |
          node scripts/verify-docs.mjs scripts/verify-docs.config.json
          node --test scripts/verify-workspace.test.mjs
          node scripts/verify-workspace.mjs --allow-uninitialized-server

      - name: Install fixed Gitleaks from the official release
        shell: bash
        run: |
          set -euo pipefail
          asset=gitleaks_8.30.1_linux_x64.tar.gz
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -fsSLo "$RUNNER_TEMP/$asset" "$base/$asset"
          curl -fsSLo "$RUNNER_TEMP/gitleaks_checksums.txt" "$base/gitleaks_8.30.1_checksums.txt"
          grep "  $asset$" "$RUNNER_TEMP/gitleaks_checksums.txt" |
            (cd "$RUNNER_TEMP" && sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the current tracked snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apimind-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/apimind-source"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/apimind-source" \
            --no-banner --redact --exit-code 1

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pinned workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci --no-audit --registry=https://registry.npmjs.org

      - name: Verify and build Web
        run: |
          make test-web
          make build-web

  skills:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pinned workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Verify Skills
        run: sh skills/scripts/verify.sh

  server:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
        ports:
          - 27017:27017
    env:
      APIMIND_MONGO_TEST_URI: mongodb://127.0.0.1:27017
    steps:
      - name: Check out the pinned workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Wait for MongoDB
        run: |
          for attempt in $(seq 1 60); do
            if nc -z 127.0.0.1 27017; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Test and build Server on the host
        run: |
          make test-server
          make build-server
