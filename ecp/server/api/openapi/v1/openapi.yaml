components:
    schemas:
        AddGroupMemberReq:
            properties:
                enterprise_id:
                    type: string
                principal_id:
                    type: string
            required:
                - enterprise_id
                - principal_id
            title: AddGroupMemberReq
            type: object
        AdmitJITReq:
            properties:
                application_id:
                    type: string
                display_name:
                    type: string
                email:
                    type: string
                email_verified:
                    format: boolean
                    type: boolean
                enterprise_id:
                    type: string
                issuer:
                    type: string
                subject:
                    type: string
            required:
                - enterprise_id
                - application_id
                - issuer
                - subject
                - email
                - email_verified
            title: AdmitJITReq
            type: object
        ApplicationResp:
            properties:
                enterprise_id:
                    type: string
                id:
                    type: string
                key:
                    type: string
                name:
                    type: string
                status:
                    type: string
                version:
                    format: int64
                    type: integer
            required:
                - id
                - enterprise_id
                - key
                - name
                - status
                - version
            title: ApplicationResp
            type: object
        AuthCallbackReq:
            properties:
                code:
                    type: string
                state:
                    type: string
            required:
                - state
                - code
            title: AuthCallbackReq
            type: object
        AuthStartReq:
            properties:
                application_instance_id:
                    type: string
                enterprise_id:
                    type: string
                kind:
                    type: string
                oidc_client_id:
                    type: string
                redirect_uri:
                    type: string
            required:
                - enterprise_id
                - oidc_client_id
                - kind
                - redirect_uri
            title: AuthStartReq
            type: object
        AuthStartResp:
            properties:
                code_challenge:
                    type: string
                expires_at:
                    format: int64
                    type: integer
                nonce:
                    type: string
                state:
                    type: string
                transaction_id:
                    type: string
            required:
                - transaction_id
                - state
                - nonce
                - code_challenge
                - expires_at
            title: AuthStartResp
            type: object
        BlockPrincipalReq:
            properties:
                enterprise_id:
                    type: string
            required:
                - enterprise_id
            title: BlockPrincipalReq
            type: object
        ConnectorResp:
            properties:
                application_id:
                    type: string
                connector_key:
                    type: string
                enterprise_id:
                    type: string
                id:
                    type: string
                instance_id:
                    type: string
                status:
                    type: string
                version:
                    format: int64
                    type: integer
            required:
                - id
                - enterprise_id
                - application_id
                - instance_id
                - connector_key
                - status
                - version
            title: ConnectorResp
            type: object
        CreateGroupReq:
            properties:
                enterprise_id:
                    type: string
                name:
                    type: string
            required:
                - enterprise_id
                - name
            title: CreateGroupReq
            type: object
        Empty:
            title: Empty
            type: object
        EnterpriseResp:
            properties:
                id:
                    type: string
                name:
                    type: string
                status:
                    type: string
            required:
                - id
                - name
                - status
            title: EnterpriseResp
            type: object
        GroupMembersResp:
            properties:
                principal_ids:
                    items:
                        type: string
                    type: array
            required:
                - principal_ids
            title: GroupMembersResp
            type: object
        GroupResp:
            properties:
                direct_member_version:
                    format: int64
                    type: integer
                enterprise_id:
                    type: string
                external_id:
                    type: string
                id:
                    type: string
                management_mode:
                    type: string
                name:
                    type: string
                provider:
                    type: string
                status:
                    type: string
            required:
                - id
                - enterprise_id
                - provider
                - external_id
                - name
                - management_mode
                - direct_member_version
                - status
            title: GroupResp
            type: object
        HealthResp:
            properties:
                status:
                    type: string
                version:
                    type: string
            required:
                - status
                - version
            title: HealthResp
            type: object
        InstanceResp:
            properties:
                application_id:
                    type: string
                canonical_url:
                    type: string
                enterprise_id:
                    type: string
                environment:
                    type: string
                id:
                    type: string
                instance_key:
                    type: string
                status:
                    type: string
                version:
                    format: int64
                    type: integer
            required:
                - id
                - enterprise_id
                - application_id
                - instance_key
                - environment
                - canonical_url
                - status
                - version
            title: InstanceResp
            type: object
        LifecycleResp:
            properties:
                principal_id:
                    type: string
                state:
                    type: string
                version:
                    format: int64
                    type: integer
            required:
                - principal_id
                - state
                - version
            title: LifecycleResp
            type: object
        ListGroupMembersReq:
            properties:
                enterprise_id:
                    type: string
            required:
                - enterprise_id
            title: ListGroupMembersReq
            type: object
        ManifestResp:
            properties:
                api_version:
                    type: string
                application_id:
                    type: string
                manifest_hash:
                    type: string
                version:
                    format: int64
                    type: integer
            required:
                - application_id
                - api_version
                - manifest_hash
                - version
            title: ManifestResp
            type: object
        PrincipalResp:
            properties:
                display_name:
                    type: string
                enterprise_id:
                    type: string
                id:
                    type: string
                issuer:
                    type: string
                normalized_email:
                    type: string
                status:
                    type: string
                subject:
                    type: string
                version:
                    format: int64
                    type: integer
            required:
                - id
                - enterprise_id
                - issuer
                - subject
                - normalized_email
                - display_name
                - status
                - version
            title: PrincipalResp
            type: object
        ProductLoginExchangeReq:
            properties:
                code:
                    type: string
            required:
                - code
            title: ProductLoginExchangeReq
            type: object
        ProductLoginExchangeResp:
            properties:
                csrf_token:
                    type: string
                expires_at:
                    format: int64
                    type: integer
                session_token:
                    type: string
            required:
                - session_token
                - csrf_token
                - expires_at
            title: ProductLoginExchangeResp
            type: object
        PutManifestReq:
            properties:
                api_version:
                    type: string
                body:
                    type: string
                enterprise_id:
                    type: string
            required:
                - enterprise_id
                - api_version
                - body
            title: PutManifestReq
            type: object
        RegisterApplicationReq:
            properties:
                enterprise_id:
                    type: string
                id:
                    type: string
                key:
                    type: string
                name:
                    type: string
            required:
                - id
                - enterprise_id
                - key
                - name
            title: RegisterApplicationReq
            type: object
        RegisterConnectorReq:
            properties:
                application_id:
                    type: string
                connector_key:
                    type: string
                enterprise_id:
                    type: string
                instance_id:
                    type: string
            required:
                - enterprise_id
                - application_id
                - instance_id
                - connector_key
            title: RegisterConnectorReq
            type: object
        RegisterEnterpriseReq:
            properties:
                id:
                    type: string
                name:
                    type: string
            required:
                - id
                - name
            title: RegisterEnterpriseReq
            type: object
        RegisterInstanceReq:
            properties:
                canonical_url:
                    type: string
                enterprise_id:
                    type: string
                environment:
                    type: string
                instance_key:
                    type: string
            required:
                - enterprise_id
                - instance_key
                - canonical_url
            title: RegisterInstanceReq
            type: object
        RevokeSessionReq:
            properties:
                enterprise_id:
                    type: string
            required:
                - enterprise_id
            title: RevokeSessionReq
            type: object
        SessionListReq:
            properties:
                enterprise_id:
                    type: string
            required:
                - enterprise_id
            title: SessionListReq
            type: object
        SessionListResp:
            properties:
                sessions:
                    items:
                        $ref: '#/components/schemas/SessionSummaryResp'
                    type: array
            required:
                - sessions
            title: SessionListResp
            type: object
        SessionSummaryResp:
            properties:
                application_instance_id:
                    type: string
                enterprise_id:
                    type: string
                expires_at:
                    format: int64
                    type: integer
                id:
                    type: string
                kind:
                    type: string
                principal_id:
                    type: string
                revoked:
                    format: boolean
                    type: boolean
            required:
                - id
                - enterprise_id
                - principal_id
                - kind
                - expires_at
                - revoked
            title: SessionSummaryResp
            type: object
        SyncDirectoryGroupReq:
            properties:
                enterprise_id:
                    type: string
                name:
                    type: string
                principal_ids:
                    items:
                        type: string
                    type: array
                provider:
                    type: string
            required:
                - enterprise_id
                - provider
                - name
                - principal_ids
            title: SyncDirectoryGroupReq
            type: object
        VersionResp:
            properties:
                api_version:
                    type: string
                version:
                    type: string
            required:
                - version
                - api_version
            title: VersionResp
            type: object
info:
    title: ECP HTTP API
    version: v1
openapi: 3.0.3
paths:
    /api/v1/applications:
        post:
            operationId: RegisterApplication
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterApplicationReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApplicationResp'
                    description: A successful response.
            summary: Register an application
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/applications/{id}/instances:
        post:
            operationId: RegisterInstance
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterInstanceReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InstanceResp'
                    description: A successful response.
            summary: Register an application instance
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/applications/{id}/manifest:
        put:
            operationId: PutManifest
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PutManifestReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ManifestResp'
                    description: A successful response.
            summary: Put a product manifest
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/auth/callback:
        get:
            operationId: AuthCallback
            parameters:
                - in: query
                  name: state
                  required: true
                  schema:
                    type: string
                - in: query
                  name: code
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SessionSummaryResp'
                    description: A successful response.
            summary: Complete an OIDC login transaction
            tags:
                - authPublic
            x-ecp-access: public
    /api/v1/auth/logout:
        post:
            operationId: Logout
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Empty'
                    description: A successful response.
            summary: End the current admin session
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/auth/session:
        get:
            operationId: CurrentSession
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SessionSummaryResp'
                    description: A successful response.
            summary: Current admin session
            tags:
                - adminRead
            x-ecp-access: public
    /api/v1/auth/sessions:
        get:
            operationId: ListSessions
            parameters:
                - in: query
                  name: enterprise_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SessionListResp'
                    description: A successful response.
            summary: List admin sessions
            tags:
                - adminRead
            x-ecp-access: public
    /api/v1/auth/sessions/{id}/revoke:
        post:
            operationId: RevokeSession
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RevokeSessionReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Empty'
                    description: A successful response.
            summary: Revoke an admin session
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/auth/start:
        get:
            operationId: AuthStart
            parameters:
                - in: query
                  name: enterprise_id
                  required: true
                  schema:
                    type: string
                - in: query
                  name: oidc_client_id
                  required: true
                  schema:
                    type: string
                - in: query
                  name: application_instance_id
                  required: false
                  schema:
                    type: string
                - in: query
                  name: kind
                  required: true
                  schema:
                    type: string
                - in: query
                  name: redirect_uri
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthStartResp'
                    description: A successful response.
            summary: Begin an OIDC login transaction
            tags:
                - authPublic
            x-ecp-access: public
    /api/v1/connector/auth/exchange:
        post:
            operationId: ExchangeProductLogin
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProductLoginExchangeReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductLoginExchangeResp'
                    description: A successful response.
            summary: Exchange a one-time product login transaction
            tags:
                - connectorMachine
            x-ecp-access: public
    /api/v1/connectors/register:
        post:
            operationId: RegisterConnector
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterConnectorReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConnectorResp'
                    description: A successful response.
            summary: Register a product connector
            tags:
                - connectorMachine
            x-ecp-access: public
    /api/v1/identity/groups:
        post:
            operationId: CreateIdentityGroup
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateGroupReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GroupResp'
                    description: A successful response.
            summary: Create an ECP-managed direct group
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/identity/groups/{id}/members:
        get:
            operationId: ListDirectGroupMembers
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - in: query
                  name: enterprise_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GroupMembersResp'
                    description: A successful response.
            summary: List direct group members
            tags:
                - adminRead
            x-ecp-access: public
        post:
            operationId: AddDirectGroupMember
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AddGroupMemberReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Empty'
                    description: A successful response.
            summary: Add one direct member to an ECP-managed group
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/identity/groups/directory/{externalId}/sync:
        post:
            operationId: SyncDirectoryGroup
            parameters:
                - in: path
                  name: externalId
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SyncDirectoryGroupReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GroupResp'
                    description: A successful response.
            summary: Synchronize a directory-managed direct group
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/identity/jit:
        post:
            operationId: AdmitJIT
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AdmitJITReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PrincipalResp'
                    description: A successful response.
            summary: Admit a verified external identity
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/identity/principals/{id}/block:
        post:
            operationId: BlockPrincipal
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BlockPrincipalReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LifecycleResp'
                    description: A successful response.
            summary: Block a principal locally
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/meta/health:
        get:
            operationId: Health
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthResp'
                    description: A successful response.
            summary: Service health
            tags:
                - metaPublic
            x-ecp-access: public
    /api/v1/meta/version:
        get:
            operationId: Version
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/VersionResp'
                    description: A successful response.
            summary: Build and contract version
            tags:
                - metaPublic
            x-ecp-access: public
