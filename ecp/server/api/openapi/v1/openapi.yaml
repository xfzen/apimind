            type: object
        PutSecurityConfigReq:
            properties:
                enterprise_id:
                    type: string
                export_enabled:
                    format: boolean
                    type: boolean
                public_sharing:
                    format: boolean
                    type: boolean
                secret_export:
                    format: boolean
                    type: boolean
            required:
                - enterprise_id
                - public_sharing
                - export_enabled
                - secret_export
            title: PutSecurityConfigReq
            type: object
        ReconcilePoliciesReq:
            properties:
                casdoor_permission_id:
                    type: string
                enterprise_id:
                    type: string
                manifest_version:
                    format: int64
                    type: integer
                policies:
                    items:
                        $ref: '#/components/schemas/PolicyItem'
                    type: array
            required:
                - enterprise_id
                - casdoor_permission_id
                - manifest_version
                - policies
            title: ReconcilePoliciesReq
            type: object
        RegisterApplicationReq:
            properties:
                enterprise_id:
                    type: string
                id:
                    type: string
                key:
                    type: string
                name:
                    type: string
            required:
                - id
                - enterprise_id
                - key
                - name
            title: RegisterApplicationReq
            type: object
        RegisterConnectorReq:
            properties:
                application_id:
                    type: string
                connector_key:
                    type: string
                enterprise_id:
                    type: string
                instance_id:
                    type: string
            required:
                - enterprise_id
                - application_id
                - instance_id
                - connector_key
            title: RegisterConnectorReq
            type: object
        RegisterEnterpriseReq:
            properties:
                id:
                    type: string
                name:
                    type: string
            required:
                - id
                - name
            title: RegisterEnterpriseReq
            type: object
        RegisterInstanceReq:
            properties:
                canonical_url:
                    type: string
                enterprise_id:
                    type: string
                environment:
                    type: string
                instance_key:
                    type: string
            required:
                - enterprise_id
                - instance_key
                - canonical_url
            title: RegisterInstanceReq
            type: object
        ResolveProductSessionReq:
            properties:
                instance_id:
                    type: string
                session_token:
                    type: string
            required:
                - instance_id
                - session_token
            title: ResolveProductSessionReq
            type: object
        ResolveProductSessionResp:
            properties:
                expires_at:
                    format: int64
                    type: integer
                lifecycle_version:
                    format: int64
                    type: integer
                principal_id:
                    type: string
                revoked:
                    format: boolean
                    type: boolean
            required:
                - principal_id
                - revoked
                - expires_at
                - lifecycle_version
            title: ResolveProductSessionResp
            type: object
        RevokeProductSessionReq:
            properties:
                instance_id:
                    type: string
                session_token:
                    type: string
            required:
                - instance_id
                - session_token
            title: RevokeProductSessionReq
            type: object
        RevokeSessionReq:
            properties:
                enterprise_id:
                    type: string
            required:
                - enterprise_id
            title: RevokeSessionReq
            type: object
        RotateCredentialReq:
            properties:
                lifetime_seconds:
                    format: int64
                    type: integer
            required:
                - lifetime_seconds
            title: RotateCredentialReq
            type: object
        SecurityConfigReq:
            properties:
                enterprise_id:
                    type: string
            required:
                - enterprise_id
            title: SecurityConfigReq
            type: object
        SecurityConfigResp:
            properties:
                application_instance_id:
                    type: string
                enterprise_id:
                    type: string
                export_enabled:
                    format: boolean
                    type: boolean
                public_sharing:
                    format: boolean
                    type: boolean
                secret_export:
                    format: boolean
                    type: boolean
                version:
                    format: int64
                    type: integer
            required:
                - enterprise_id
                - application_instance_id
                - public_sharing
                - export_enabled
                - secret_export
                - version
            title: SecurityConfigResp
            type: object
        SessionListReq:
            properties:
                enterprise_id:
                    type: string
            required:
                - enterprise_id
            title: SessionListReq
            type: object
        SessionListResp:
            properties:
                sessions:
                    items:
                        $ref: '#/components/schemas/SessionSummaryResp'
                    type: array
            required:
                - sessions
            title: SessionListResp
            type: object
        SessionSummaryResp:
            properties:
                application_instance_id:
                    type: string
                csrf_token:
                    type: string
                enterprise_id:
                    type: string
                expires_at:
                    format: int64
                    type: integer
                id:
                    type: string
                kind:
                    type: string
                principal_id:
                    type: string
                revoked:
                    format: boolean
                    type: boolean
            required:
                - id
                - enterprise_id
                - principal_id
                - kind
                - expires_at
                - revoked
            title: SessionSummaryResp
            type: object
        SyncDirectoryGroupReq:
            properties:
                enterprise_id:
                    type: string
                name:
                    type: string
                principal_ids:
                    items:
                        type: string
                    type: array
                provider:
                    type: string
            required:
                - enterprise_id
                - provider
                - name
                - principal_ids
            title: SyncDirectoryGroupReq
            type: object
        VersionResp:
            properties:
                api_version:
                    type: string
                version:
                    type: string
            required:
                - version
                - api_version
            title: VersionResp
            type: object
info:
    title: ECP HTTP API
    version: v1
openapi: 3.0.3
paths:
    /api/v1/access/authorize:
        post:
            operationId: Authorize
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AuthorizeReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthorizationDecisionResp'
                    description: A successful response.
            summary: Authorize one product operation
            tags:
                - connectorMachine
            x-ecp-access: public
    /api/v1/access/batch:
        post:
            operationId: BatchAuthorize
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BatchAuthorizeReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BatchAuthorizeResp'
                    description: A successful response.
            summary: Authorize a batch of product operations
            tags:
                - connectorMachine
            x-ecp-access: public
    /api/v1/application-instances/{id}/resources:
        get:
            operationId: SearchProductResources
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - in: query
                  name: resource_type
                  required: false
                  schema:
                    type: string
                - in: query
                  name: query
                  required: false
                  schema:
                    type: string
                - in: query
                  name: limit
                  required: false
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductResourceListResp'
                    description: A successful response.
            summary: Search resources visible to the current enterprise administrator
            tags:
                - adminRead
            x-ecp-access: public
    /api/v1/application-instances/{id}/resources/{resourceType}/{resourceId}:
        get:
            operationId: ResolveProductResource
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - in: path
                  name: resourceType
                  required: true
                  schema:
                    type: string
                - in: path
                  name: resourceId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductResourceResp'
                    description: A successful response.
            summary: Resolve one product resource visible to the current enterprise administrator
            tags:
                - adminRead
            x-ecp-access: public
    /api/v1/application-instances/{id}/resources/{resourceType}/{resourceId}/ancestry:
        get:
            operationId: GetProductResourceAncestry
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - in: path
                  name: resourceType
                  required: true
                  schema:
                    type: string
                - in: path
                  name: resourceId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductResourceListResp'
                    description: A successful response.
            summary: Get the visible authorization ancestry for one product resource
            tags:
                - adminRead
            x-ecp-access: public
    /api/v1/applications:
        get:
            operationId: ListApplications
            parameters:
                - in: query
                  name: enterprise_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApplicationListResp'
                    description: A successful response.
            summary: List registered applications
            tags:
                - adminRead
            x-ecp-access: public
        post:
            operationId: RegisterApplication
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterApplicationReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApplicationResp'
                    description: A successful response.
            summary: Register an application
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/applications/{id}/instances:
        post:
            operationId: RegisterInstance
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterInstanceReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InstanceResp'
                    description: A successful response.
            summary: Register an application instance
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/applications/{id}/manifest:
        get:
            operationId: GetManifest
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - in: query
                  name: enterprise_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ManifestDetailResp'
                    description: A successful response.
            summary: Get the accepted product manifest
            tags:
                - adminRead
            x-ecp-access: public
        put:
            operationId: PutManifest
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PutManifestReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ManifestResp'
                    description: A successful response.
            summary: Put a product manifest
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/audit/events:
        get:
            operationId: QueryAudit
            parameters:
                - in: query
                  name: enterprise_id
                  required: true
                  schema:
                    type: string
                - in: query
                  name: application_instance_id
                  required: false
                  schema:
                    type: string
                - in: query
                  name: operation_id
                  required: false
                  schema:
                    type: string
                - in: query
                  name: sequence_after
                  required: false
                  schema:
                    format: int64
                    type: integer
                - in: query
                  name: limit
                  required: false
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuditQueryResp'
                    description: A successful response.
            summary: Query append-only audit events
            tags:
                - adminRead
            x-ecp-access: public
    /api/v1/audit/export:
        post:
            operationId: ExportAudit
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AuditExportReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuditExportResp'
                    description: A successful response.
            summary: Create a verifiable audit export manifest
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/auth/callback:
        get:
            operationId: AuthCallback
            parameters:
                - in: query
                  name: state
                  required: true
                  schema:
                    type: string
                - in: query
                  name: code
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SessionSummaryResp'
                    description: A successful response.
            summary: Complete an OIDC login transaction
            tags:
                - authPublic
            x-ecp-access: public
    /api/v1/auth/logout:
        post:
            operationId: Logout
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Empty'
                    description: A successful response.
            summary: End the current admin session
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/auth/session:
        get:
            operationId: CurrentSession
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SessionSummaryResp'
                    description: A successful response.
            summary: Current admin session
            tags:
                - adminRead
            x-ecp-access: public
    /api/v1/auth/sessions:
        get:
            operationId: ListSessions
            parameters:
                - in: query
                  name: enterprise_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SessionListResp'
                    description: A successful response.
            summary: List admin sessions
            tags:
                - adminRead
            x-ecp-access: public
    /api/v1/auth/sessions/{id}/revoke:
        post:
            operationId: RevokeSession
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RevokeSessionReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Empty'
                    description: A successful response.
            summary: Revoke an admin session
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/auth/start:
        get:
            operationId: AuthStart
            parameters:
                - in: query
                  name: enterprise_id
                  required: true
                  schema:
                    type: string
                - in: query
                  name: oidc_client_id
                  required: true
                  schema:
                    type: string
                - in: query
                  name: application_instance_id
                  required: false
                  schema:
                    type: string
                - in: query
                  name: kind
                  required: true
                  schema:
                    type: string
                - in: query
                  name: redirect_uri
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthStartResp'
                    description: A successful response.
            summary: Begin an OIDC login transaction
            tags:
                - authPublic
            x-ecp-access: public
    /api/v1/connector/audit/events:
        post:
            operationId: IngestConnectorAudit
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/IngestConnectorAuditReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Empty'
                    description: A successful response.
            summary: Ingest product audit events
            tags:
                - connectorMachine
            x-ecp-access: public
    /api/v1/connector/auth/complete:
        post:
            operationId: CompleteProductLogin
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProductAuthCompleteReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductAuthCompleteResp'
                    description: A successful response.
            summary: Complete a product OIDC login and issue a one-time exchange
            tags:
                - connectorMachine
            x-ecp-access: public
    /api/v1/connector/auth/exchange:
        post:
            operationId: ExchangeProductLogin
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProductLoginExchangeReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductLoginExchangeResp'
                    description: A successful response.
            summary: Exchange a one-time product login transaction
            tags:
                - connectorMachine
            x-ecp-access: public
    /api/v1/connector/auth/start:
        post:
            operationId: StartProductLogin
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProductAuthStartReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductAuthStartResp'
                    description: A successful response.
            summary: Begin a product OIDC login transaction
            tags:
                - connectorMachine
            x-ecp-access: public
    /api/v1/connector/heartbeat:
        post:
            operationId: ConnectorHeartbeat
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ConnectorHeartbeatReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConnectorHeartbeatResp'
                    description: A successful response.
            summary: Report product Connector health
            tags:
                - connectorMachine
            x-ecp-access: public
    /api/v1/connector/instances/{id}/policy-version:
        get:
            operationId: GetPolicyVersion
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PolicyVersionResp'
                    description: A successful response.
            summary: Get the current policy projection version
            tags:
                - connectorMachine
            x-ecp-access: public
    /api/v1/connector/lifecycle/poll:
        post:
            operationId: PollLifecycleChanges
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LifecyclePollReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LifecyclePollResp'
                    description: A successful response.
            summary: Poll principal lifecycle changes
            tags:
                - connectorMachine
            x-ecp-access: public
    /api/v1/connector/service-credentials/authenticate:
        post:
            operationId: AuthenticateServiceCredential
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AuthenticateServiceCredentialReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthenticateServiceCredentialResp'
                    description: A successful response.
            summary: Authenticate a service credential and authorize one product operation
            tags:
                - connectorMachine
            x-ecp-access: public
    /api/v1/connector/sessions/resolve:
        post:
            operationId: ResolveProductSession
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ResolveProductSessionReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResolveProductSessionResp'
                    description: A successful response.
            summary: Resolve a product session
            tags:
                - connectorMachine
            x-ecp-access: public
    /api/v1/connector/sessions/revoke:
        post:
            operationId: RevokeProductSession
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RevokeProductSessionReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Empty'
                    description: A successful response.
            summary: Revoke a product session by its opaque token
            tags:
                - connectorMachine
            x-ecp-access: public
    /api/v1/connector/signing-keys/delegation:
        get:
            operationId: GetDelegationKeySet
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DelegationKeySetResp'
                    description: A successful response.
            summary: Get the signed Delegation verification KeySet
            tags:
                - connectorMachine
            x-ecp-access: public
    /api/v1/connector/signing-keys/delegation/ack:
        post:
            operationId: AckDelegationKeySet
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AckDelegationKeySetReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Empty'
                    description: A successful response.
            summary: Acknowledge the exact accepted Delegation KeySet
            tags:
                - connectorMachine
            x-ecp-access: public
    /api/v1/connectors/register:
        post:
            operationId: RegisterConnector
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterConnectorReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConnectorResp'
                    description: A successful response.
            summary: Register a product connector
            tags:
                - connectorMachine
            x-ecp-access: public
    /api/v1/credentials:
        post:
            operationId: CreateCredential
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCredentialReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CredentialResp'
                    description: A successful response.
            summary: Create a scoped service credential
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/credentials/{id}/revoke:
        post:
            operationId: RevokeCredential
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CredentialIDReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Empty'
                    description: A successful response.
            summary: Revoke a service credential
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/credentials/{id}/rotate:
        post:
            operationId: RotateCredential
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RotateCredentialReq'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CredentialResp'
                    description: A successful response.
            summary: Rotate a service credential
            tags:
                - adminWrite
            x-ecp-access: public
    /api/v1/identity/groups:
        get:
            operationId: ListIdentityGroups
            parameters:
                - in: query
                  name: enterprise_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GroupListResp'
                    description: A successful response.
            summary: List enterprise identity groups
            tags:
                - adminRead
            x-ecp-access: public
        post:
            operationId: CreateIdentityGroup
            requestBody:
                content:
